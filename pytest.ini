[pytest]
addopts = --verbose -s --tb=short
markers =
    alerts: Tests for JavaScript alerts handling
    basic_auth: Tests for Basic HTTP authentication
    file_download: Tests for file download functionality
    file_upload: Tests for file upload functionality
    demo: Demo test matching JS framework reference
    unit_4: Unit 4 practice task tests for userinyerface.com
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
